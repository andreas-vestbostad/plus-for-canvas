name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check manifest and locales parse
        run: node -e "require('./manifest.json'); require('./_locales/en/messages.json'); require('./_locales/nb/messages.json')"
      - name: Build zip
        run: npm run pack
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: zip
          path: plus-for-canvas-*.zip

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zip
      - name: Attach zip to release
        uses: softprops/action-gh-release@v3
        with:
          files: plus-for-canvas-*.zip
